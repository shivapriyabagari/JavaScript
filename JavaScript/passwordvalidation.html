<html>
    <body>
        <input type="password" id="pass" placeholder="Enter password">
        <div id="valid" style="display:none;">
        <h4>Password must contain:</h4>

         <p id="len_pass" style="color:red;">Length must be exactly 8 characters</p>

         <p id="upper_pass" style="color:red;">One uppercase letter</p>

         <p id="lower_pass" style="color:red;">One lowercase letter</p>

         <p id="num_pass" style="color:red;">One number</p>
        </div>
        <script>
            document.getElementById("pass").addEventListener("keyup", function () {

            let password = document.getElementById("pass").value;
            if (password.length > 0) {
                document.getElementById("valid").style.display = "block";
            } else {
                document.getElementById("valid").style.display = "none";
            }
            if (password.length == 8) {
                document.getElementById("len_pass").style.color = "green";
            } else {
                document.getElementById("len_pass").style.color = "red";
            }
            if (/[A-Z]/.test(password)) {
                document.getElementById("upper_pass").style.color = "green";
            } else {
                document.getElementById("upper_pass").style.color = "red";
            }
            if (/[a-z]/.test(password)) {
                document.getElementById("lower_pass").style.color = "green";
            } else {
                document.getElementById("lower_pass").style.color = "red";
            }
            if (/[0-9]/.test(password)) {
                document.getElementById("num_pass").style.color = "green";
            } else {
                document.getElementById("num_pass").style.color = "red";
            }
            });
        </script>
    </body>
</html>
